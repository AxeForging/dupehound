dir_structure:
  allowedPaths:
    - "."
    - "actions/**"
    - "domain/**"
    - "services/**"
    - "helpers/**"
    - "integration/**"
    - ".github/**"
    - "docs/**"
    - "setup/**"
  disallowedPaths:
    - "vendor/**"
    - "node_modules/**"
    - ".git/**"
  requiredPaths:
    - "actions"
    - "domain"
    - "services"
    - "helpers"

file_naming_pattern:
  allowed:
    # Go files are named <feature>.<concern>.go (tests: <feature>.<concern>_test.go),
    # so a file's name says which feature owns it. main.go is the one exception.
    - "*.*.go"
    - "main.go"
    - "*.mod"
    - "*.sum"
    - "*.yaml"
    - "*.yml"
    - "*.md"
    - "Makefile"
    - "LICENSE"
    - ".gitignore"
    - ".golangci.yml"
    - ".goreleaser.yml"
    - ".github/**"
    - "*.txt"
    - "*.gif"
    - "*.png"
    - "*.sh"
    - "*.golden"
  disallowed:
    - "*.env*"
    - ".env*"
    - "*.key"
    - "*.pem"
    - "*.log"
    - ".DS_Store"
  required:
    - "go.mod"
    - "README.md"
    - ".gitignore"
    - "main.go"

ignore:
  - ".git"
  - ".claude"
  - "vendor"
  - "node_modules"
  - "dist"
  - "dupehound"
  - "coverage.out"
  - "docs/demo/*.cast"
  - "docs/demo/.bin"
